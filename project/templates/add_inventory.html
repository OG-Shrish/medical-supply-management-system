{% extends "layout.html" %}
{% block body %}

<div class="hero-header" style="background-image: url('{{ url_for('static', filename='img/home-bg.jpg') }}'); background-size: cover; background-position: center; position: relative;">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7);"></div>
  <div class="container" style="position: relative; z-index: 1;">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        <h1 class="hero-title">Add Inventory</h1>
        <p class="hero-subtitle text-white">Track new batches and analyze AI expiry risks</p>
      </div>
    </div>
  </div>
</div>

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="glass-card">
        <h3 class="mb-4 text-center" style="color: var(--primary-color);">Add Inventory Batch</h3>
        <form action="/add_inventory" method="POST">

            <div class="form-group mb-3">
                <label>Medicine Name</label>
                <input type="text" name="medicine_name" class="form-control" placeholder="e.g. Paracetamol 500mg" required>
            </div>

            <div class="form-group mb-3">
                <label>Quantity Remaining</label>
                <input type="number" name="quantity" class="form-control" placeholder="e.g. 100" required>
            </div>

            <div class="form-group mb-3">
                <label>Expiry Date</label>
                <input type="date" name="expiry_date" class="form-control" required>
            </div>

            <div class="form-group mb-4">
                <label>Average Daily Sale</label>
                <input type="number" step="0.1" name="avg_sale" class="form-control" placeholder="e.g. 2.5" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm">
                    Add Inventory
                </button>
            </div>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
